<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SkillMap</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">
  <div class="auth-split">
    <div class="auth-left">
      <a href="index.html" class="auth-logo">Skill<span>Map</span></a>
      <div class="auth-left-content">
        <h2>Welcome back,<br/>keep growing.</h2>
        <p>Your skills, your progress, your roadmap — all waiting for you.</p>
        <div class="auth-perks">
          <div class="perk">✅ Track 100+ technical skills</div>
          <div class="perk">✅ AI-powered gap analysis</div>
          <div class="perk">✅ Compete on the leaderboard</div>
          <div class="perk">✅ Download progress reports</div>
        </div>
      </div>
      <div class="auth-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
    </div>
    <div class="auth-right">
      <div class="auth-form-wrap">
        <h1>Log In</h1>
        <p class="auth-sub">No account? <a href="signup.html">Sign up free</a></p>
        <div id="loginError" class="auth-error" style="display:none"></div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" class="form-input"/>
        </div>
        <div class="form-group pass-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" class="form-input"/>
          <span class="show-pass" onclick="togglePass('loginPassword',this)">Show</span>
        </div>
        <div class="form-options">
          <label class="checkbox-label"><input type="checkbox" id="rememberMe"/> Remember me</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button class="auth-btn" onclick="handleLogin()">
          <span id="loginBtnText">Log In</span>
        </button>
        <div class="divider"><span>or</span></div>
        <button class="social-btn" onclick="demoLogin()">🎓 Try Demo Student Account</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
