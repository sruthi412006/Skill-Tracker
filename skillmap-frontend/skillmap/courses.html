<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Courses — SkillMap</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">Skill<span>Map</span></div>
    <nav class="sb-nav">
      <a href="dashboard.html" class="sb-link">📊 Dashboard</a>
      <a href="upload.html" class="sb-link">📄 Upload Resume</a>
      <a href="skills.html" class="sb-link">🛠 My Skills</a>
      <a href="courses.html" class="sb-link active">📚 Courses</a>
      <a href="leaderboard.html" class="sb-link">🏅 Leaderboard</a>
      <a href="report.html" class="sb-link">📥 My Report</a>
      <a href="profile.html" class="sb-link">👤 Profile</a>
    </nav>
    <div class="sb-bottom">
      <button class="theme-toggle-full" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span></button>
      <div class="sb-user" id="sbUser"></div>
      <button class="sb-logout" onclick="logout()">⏻ Log Out</button>
    </div>
  </aside>
  <main class="dash-main">
    <header class="dash-header">
      <button class="sb-toggle" onclick="toggleSidebar()">☰</button>
      <div class="dash-greeting">My Courses</div>
      <div class="dash-header-right">
        <button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        <button class="upload-btn-sm" onclick="showAddCourseModal()">+ Add Course</button>
      </div>
    </header>
    <div class="dash-content">
      <!-- Course Search & Filter -->
      <div class="search-filter-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="courseSearch" class="search-input" placeholder="Search courses..." oninput="applyCourseFilters()"/>
        </div>
        <div class="filter-group">
          <button class="filter-btn active" onclick="setCourseStatus('all',this)">All</button>
          <button class="filter-btn" onclick="setCourseStatus('In Progress',this)">⏳ Ongoing</button>
          <button class="filter-btn" onclick="setCourseStatus('Completed',this)">✅ Completed</button>
          <button class="filter-btn" onclick="setCourseStatus('Not Started',this)">🔵 Not Started</button>
        </div>
        <div class="filter-group">
          <select id="platformFilter" class="filter-select" onchange="applyCourseFilters()">
            <option value="all">All Platforms</option>
            <option>Udemy</option><option>Coursera</option><option>edX</option>
            <option>YouTube</option><option>College</option><option>Other</option>
          </select>
        </div>
      </div>
      <!-- Progress completion message -->
      <div id="courseInsight" class="insight-banner" style="display:none;margin-bottom:16px"></div>
      <div id="courseGrid" class="course-grid"></div>
    </div>
  </main>

  <div id="addCourseModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header"><h3>Add New Course</h3><button class="modal-close" onclick="closeCourseModal()">✕</button></div>
      <div class="form-group"><label>Course Name</label><input type="text" id="newCourseName" class="form-input" placeholder="e.g. React Complete Guide"/></div>
      <div class="form-row">
        <div class="form-group">
          <label>Platform</label>
          <select id="newCoursePlatform" class="form-input">
            <option>Udemy</option><option>Coursera</option><option>edX</option>
            <option>YouTube</option><option>College</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Progress: <span id="courseProgLabel">0%</span></label>
          <input type="range" min="0" max="100" value="0" id="newCourseProgress" oninput="document.getElementById('courseProgLabel').textContent=this.value+'%'"/>
        </div>
      </div>
      <button class="auth-btn" onclick="addCourse()">Add Course</button>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="courses.js"></script>
</body>
</html>
