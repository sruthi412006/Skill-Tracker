<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Skills — SkillMap</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">Skill<span>Map</span></div>
    <nav class="sb-nav">
      <a href="dashboard.html" class="sb-link">📊 Dashboard</a>
      <a href="upload.html" class="sb-link">📄 Upload Resume</a>
      <a href="skills.html" class="sb-link active">🛠 My Skills</a>
      <a href="courses.html" class="sb-link">📚 Courses</a>
      <a href="leaderboard.html" class="sb-link">🏅 Leaderboard</a>
      <a href="report.html" class="sb-link">📥 My Report</a>
      <a href="profile.html" class="sb-link">👤 Profile</a>
    </nav>
    <div class="sb-bottom">
      <button class="theme-toggle-full" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span></button>
      <div class="sb-user" id="sbUser"></div>
      <button class="sb-logout" onclick="logout()">⏻ Log Out</button>
    </div>
  </aside>
  <main class="dash-main">
    <header class="dash-header">
      <button class="sb-toggle" onclick="toggleSidebar()">☰</button>
      <div class="dash-greeting">My Skills</div>
      <div class="dash-header-right">
        <button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        <button class="upload-btn-sm" onclick="showAddSkillModal()">+ Add Skill</button>
      </div>
    </header>
    <div class="dash-content">
      <!-- Search & Filter Bar -->
      <div class="search-filter-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="skillSearch" class="search-input" placeholder="Search skills..." oninput="applyFilters()"/>
        </div>
        <div class="filter-group">
          <button class="filter-btn active" onclick="setLevelFilter('all',this)">All Levels</button>
          <button class="filter-btn" onclick="setLevelFilter('Beginner',this)">🟡 Beginner</button>
          <button class="filter-btn" onclick="setLevelFilter('Intermediate',this)">🔵 Intermediate</button>
          <button class="filter-btn" onclick="setLevelFilter('Advanced',this)">🟢 Advanced</button>
        </div>
        <div class="filter-group">
          <select id="catFilter" class="filter-select" onchange="applyFilters()">
            <option value="all">All Categories</option>
            <option>Programming</option><option>Web</option><option>Database</option>
            <option>CS Fundamentals</option><option>Cloud</option><option>Tools</option><option>AI/ML</option>
          </select>
        </div>
      </div>
      <!-- Weak Area Alert -->
      <div id="weakAreaAlert" class="weak-alert" style="display:none"></div>
      <div id="skillsGrid" class="skills-grid"></div>
      <div id="noSkillsMsg" style="display:none;text-align:center;padding:40px;color:var(--text2)">No skills match your search.</div>
    </div>
  </main>

  <!-- ADD SKILL MODAL -->
  <div id="addSkillModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header"><h3>Add New Skill</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="form-group"><label>Skill Name</label><input type="text" id="newSkillName" class="form-input" placeholder="e.g. React, Python, Docker"/></div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select id="newSkillCat" class="form-input">
            <option>Programming</option><option>Web</option><option>Database</option>
            <option>CS Fundamentals</option><option>Cloud</option><option>Tools</option><option>AI/ML</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Proficiency: <span id="profLabel">50%</span></label>
          <input type="range" min="0" max="100" value="50" id="newSkillScore" oninput="document.getElementById('profLabel').textContent=this.value+'%'"/>
        </div>
      </div>
      <button class="auth-btn" onclick="addSkill()">Add Skill</button>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="skills.js"></script>
</body>
</html>
